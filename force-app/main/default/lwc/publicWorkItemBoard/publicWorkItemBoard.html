<template>
  <section class="board">
    <header class="board-head">
      <div>
        <h1 class="title">{headingLabel}</h1>
        <template lwc:if={freshnessLabel}>
          <p class="freshness">{freshnessLabel}</p>
        </template>
      </div>
      <div class="head-side">
        <span class="total">{countLabel}</span>
        <!-- Re-reads through the same parameterless method the page loaded with. It can ask
             for nothing narrower or wider, and there is no write path behind it. -->
        <span class="refresh">
          <span class="checked" data-checked>{checkedLabel}</span>
          <button
            type="button"
            class="view-btn"
            data-action="refresh"
            onclick={handleRefresh}
          >
            Refresh
          </button>
        </span>
      </div>
    </header>

    <template lwc:if={isLoading}>
      <p class="state" data-state="loading">Loading…</p>
    </template>

    <template lwc:elseif={hasError}>
      <!-- Fixed wording. The server sends no detail, and the page invents none. -->
      <div class="state state-error" data-state="error">
        <p class="state-title">{errorMessage}</p>
        <p class="state-detail">Please try again shortly.</p>
      </div>
    </template>

    <template lwc:elseif={isEmpty}>
      <div class="state" data-state="empty">
        <p class="state-title">Nothing to show yet.</p>
        <p class="state-detail">
          No work is public on this board at the moment.
        </p>
      </div>
    </template>

    <template lwc:else>
      <!-- Display only. Both payloads arrived in the one cacheable call that loaded the
           page; switching here re-renders what is already in memory and never reaches the
           server. The Apex method takes no parameters, so there is nothing this control
           could send even if it tried. -->
      <div class="views" role="group" aria-label="Board view">
        <button
          type="button"
          class={taskToggleClass}
          data-view="tasks"
          aria-pressed={taskPressed}
          onclick={handleView}
        >
          Tasks
        </button>
        <button
          type="button"
          class={epicToggleClass}
          data-view="epics"
          aria-pressed={epicPressed}
          onclick={handleView}
        >
          Epics
        </button>
      </div>

      <template lwc:if={isTaskView}>
        <template lwc:if={isTaskViewEmpty}>
          <div class="state" data-empty="tasks">
            <p class="state-title">No open work right now.</p>
            <p class="state-detail">
              Every epic on this board is complete. Switch to Epics to see them.
            </p>
          </div>
        </template>

        <template lwc:else>
          <div class="columns" data-state="ready">
            <template for:each={viewColumns} for:item="col">
              <section class="column" key={col.key} data-column={col.key}>
                <h2 class="col-head">
                  <span class="col-name">{col.label}</span>
                  <span class="col-count">{col.countLabel}</span>
                </h2>
                <template lwc:if={col.isEmpty}>
                  <p class="col-empty">Nothing here</p>
                </template>
                <template for:each={col.cards} for:item="card">
                  <div class="stack" key={card.recordNumber}>
                    <c-public-work-item-card
                      card={card}
                    ></c-public-work-item-card>
                    <template lwc:if={card.hasChildren}>
                      <ul class="children">
                        <template for:each={card.children} for:item="child">
                          <li key={child.recordNumber}>
                            <c-public-work-item-card
                              card={child}
                            ></c-public-work-item-card>
                          </li>
                        </template>
                      </ul>
                    </template>
                  </div>
                </template>
              </section>
            </template>
          </div>

          <template lwc:if={hasOther}>
            <section class="other" data-region="other">
              <h2 class="other-head">Other</h2>
              <div class="other-cards">
                <template for:each={otherCards} for:item="card">
                  <c-public-work-item-card
                    key={card.recordNumber}
                    card={card}
                  ></c-public-work-item-card>
                </template>
              </div>
            </section>
          </template>
        </template>
      </template>

      <template lwc:else>
        <div class="epic-view" data-state="epics">
          <template lwc:if={isEpicViewEmpty}>
            <div class="state" data-empty="epics">
              <p class="state-title">Nothing to roll up yet.</p>
              <p class="state-detail">
                No public work is typed as an epic, and nothing else is public
                either.
              </p>
            </div>
          </template>

          <template lwc:else>
            <!-- The same columns as the task view, from the same configuration, keyed on
                 each card's own status. Not a second layout: one board, read two ways. The
                 Done column is bounded for epics because the server sends at most three
                 completed ones. -->
            <div class="columns" data-region="epic-columns">
              <template for:each={epicColumns} for:item="col">
                <section
                  class="column"
                  key={col.key}
                  data-epic-column={col.key}
                >
                  <h2 class="col-head">
                    <span class="col-name">{col.label}</span>
                    <span class="col-count">{col.countLabel}</span>
                  </h2>
                  <template lwc:if={col.isEmpty}>
                    <p class="col-empty" data-empty={col.emptyKey}>
                      {col.emptyLabel}
                    </p>
                  </template>
                  <!-- Two kinds of card share these columns. Which one a card is was
                       decided by the server: the epic toggle is a transform that applies
                       only to cards whose source rolls up into epics, and the rest pass
                       through untouched into the column their own status names. -->
                  <template for:each={col.cards} for:item="entry">
                    <div class="stack" key={entry.key}>
                      <template lwc:if={entry.isEpic}>
                        <c-public-epic-card epic={entry}></c-public-epic-card>
                      </template>
                      <template lwc:else>
                        <c-public-work-item-card
                          card={entry}
                        ></c-public-work-item-card>
                      </template>
                    </div>
                  </template>
                </section>
              </template>
            </div>

            <template lwc:if={hasOtherEpics}>
              <section class="other" data-region="other-epics">
                <h2 class="other-head">Other</h2>
                <div class="other-cards">
                  <template for:each={otherEpics} for:item="entry">
                    <div class="stack" key={entry.key}>
                      <template lwc:if={entry.isEpic}>
                        <c-public-epic-card epic={entry}></c-public-epic-card>
                      </template>
                      <template lwc:else>
                        <c-public-work-item-card
                          card={entry}
                        ></c-public-work-item-card>
                      </template>
                    </div>
                  </template>
                </div>
              </section>
            </template>
          </template>
        </div>
      </template>
    </template>
  </section>
</template>
