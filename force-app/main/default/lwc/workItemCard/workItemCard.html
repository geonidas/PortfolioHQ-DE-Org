<template>
  <article
    class={card.cssClass}
    data-id={card.id}
    data-status={card.status}
    role="button"
    tabindex="0"
    onclick={handleSelect}
    onkeydown={handleKey}
  >
    <div class="row head">
      <!-- What the work is called, first and largest. With no title synced this falls back to
                 the external key, toned down, because an untitled card should not look titled. -->
      <h3 class={card.headingClass}>{card.heading}</h3>
      <template lwc:if={card.showSyncFlag}>
        <span class={card.syncClass} title={card.syncTitle}
          >{card.syncStatus}</span
        >
      </template>
    </div>

    <div class="row ident">
      <!-- Record number and remote key together: both identify the same card, so they belong
                 in one place, below the title rather than in front of it. -->
      <span class="num">{card.identLabel}</span>
      <!-- No type badge at all when the type is unknown. An empty badge would read as
                 damaged; an absent one reads as untyped, which is the truth. -->
      <template lwc:if={card.hasType}>
        <span class="badge">{card.type}</span>
      </template>
    </div>

    <template lwc:if={card.hasDescription}>
      <p class="desc">{card.description}</p>
    </template>
    <template lwc:else>
      <p class="desc desc-none">No description synced</p>
    </template>

    <template lwc:if={card.hasMeta}>
      <div class="row meta">
        <template lwc:if={card.hasPoints}>
          <span class="pts">{card.storyPoints} pts</span>
        </template>
        <template lwc:if={card.hasProjectLabel}>
          <span class="proj">{card.projectLabel}</span>
        </template>
      </div>
    </template>

    <template lwc:if={card.showParentNote}>
      <p class="parent-note">{card.parentNote}</p>
    </template>
  </article>
</template>
