<template>
  <!-- No role, no tabindex, no handlers. This board is read only, and a card that announces
         itself as a button but does nothing is worse than a card that is plainly static. -->
  <article
    class="card"
    data-number={card.recordNumber}
    data-status={card.status}
  >
    <div class="row head">
      <h3 class={card.headingClass}>{card.heading}</h3>
      <template lwc:if={card.showSyncFlag}>
        <span class={card.syncClass}>{card.syncStatus}</span>
      </template>
    </div>

    <div class="row ident">
      <span class="num">{card.identLabel}</span>
      <!-- Absent, not empty, when the type is unknown - an untyped card should read as
                 untyped rather than damaged. -->
      <template lwc:if={card.hasType}>
        <span class="badge">{card.type}</span>
      </template>
      <template lwc:if={card.hasProjectLabel}>
        <span class="proj">{card.projectLabel}</span>
      </template>
    </div>

    <template lwc:if={card.hasLastSynced}>
      <p class="synced" data-synced>{card.lastSyncedLabel}</p>
    </template>
  </article>
</template>
